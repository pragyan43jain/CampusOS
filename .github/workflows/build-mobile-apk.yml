name: Build CampusOS Mobile APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Application
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://campus-os-pi-three.vercel.app/api' }}
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools,platforms;android-34,build-tools;34.0.0

      - name: Make Gradlew Executable
        run: chmod +x frontend/android/gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK Artifact
        run: |
          APK_PATH="frontend/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK not found at $APK_PATH"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          if [ "$SIZE" -le 100000 ]; then
            echo "Error: APK file is unexpectedly small ($SIZE bytes)"
            exit 1
          fi
          echo "Verified APK generated successfully at $APK_PATH ($SIZE bytes)"

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusOS-Mobile-App
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish latest Android APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: frontend/android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          if ! gh release view mobile-latest >/dev/null 2>&1; then
            gh release create mobile-latest "$APK_PATH" \
              --title "CampusOS Android App" \
              --notes "Latest Android APK built from the main branch. This is a debug-signed build." \
              --target "$GITHUB_SHA"
          else
            gh release upload mobile-latest "$APK_PATH" --clobber
          fi
