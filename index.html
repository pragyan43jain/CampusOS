    const { useState, useEffect } = React;

    // Attendance Engine
    function calculateAttendance(attended, total) {
      if (total <= 0) return { attended: 0, total: 0, percentage: 100, safeToMiss: 0, needToAttend: 0, isCritical: false };
      const percentage = Number(((attended / total) * 100).toFixed(1));
      const isCritical = percentage < 75;
      let safeToMiss = 0;
      let needToAttend = 0;
      if (percentage >= 75) {
        safeToMiss = Math.max(0, Math.floor((attended - 0.75 * total) / 0.75));
      } else {
        needToAttend = Math.max(1, Math.ceil((0.75 * total - attended) / 0.25));
      }
      return { attended, total, percentage, safeToMiss, needToAttend, isCritical };
    }

                    </div>
                  )}

                  {/* STEP 2: SETUP */}
                  {focusStep === 'setup' && (
                    <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-medium)', borderRadius: 'var(--radius-lg)', padding: '2rem' }}>
                      <h3 style={{ fontSize: '1.2rem', fontWeight: 800, marginBottom: '1.5rem' }}>Configure Session</h3>
                      <div style={{ marginBottom: '1.5rem' }}>
                        <label style={{ display: 'block', marginBottom: '0.5rem', fontWeight: 600, fontSize: '0.9rem' }}>Duration (Minutes):</label>
                        <input 
                          type="number" 
                          value={focusMinutes} 
                          onChange={(e) => setFocusMinutes(Number(e.target.value))} 
                          style={{ width: '100%', padding: '0.75rem', background: 'var(--bg-surface-elevated)', border: '1px solid var(--border-medium)', color: 'var(--text-primary)', borderRadius: 'var(--radius-md)' }}
                        />
                      </div>
                      <div style={{ marginBottom: '1.5rem', display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                        <input 
                          type="checkbox" 
                          checked={focusDnd} 
                          onChange={(e) => setFocusDnd(e.target.checked)} 
                          id="dnd-toggle"
                          style={{ width: '18px', height: '18px', accentColor: 'var(--brand-color)' }}
                        />
                        <label htmlFor="dnd-toggle" style={{ fontWeight: 600, fontSize: '0.9rem', cursor: 'pointer' }}>Enable System Do Not Disturb (DND)</label>
                      </div>
                      <div style={{ display: 'flex', gap: '1rem' }}>
                        <button onClick={() => setFocusStep('subject')} className="btn-primary">Next: Pick Subject</button>
                        <button onClick={() => setFocusStep('idle')} className="btn-outline">Cancel</button>
                      </div>
                    </div>
                  )}

                  {/* STEP 3: SUBJECT PICKER */}
                  {focusStep === 'subject' && (
                    <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-medium)', borderRadius: 'var(--radius-lg)', padding: '2rem' }}>
                      <h3 style={{ fontSize: '1.2rem', fontWeight: 800, marginBottom: '1rem' }}>Select Target Course / Subject</h3>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '1rem', margin: '1.5rem 0' }}>
                        {lowMarkSubjects.map((subj) => (
                          <button 
                            key={subj.id}
                            onClick={() => { setFocusSubject(subj); setFocusStep('active'); startFocusClock(focusMinutes); }}
                            style={{ padding: '1.2rem', background: 'var(--bg-surface-elevated)', border: '1px solid var(--border-medium)', color: 'var(--text-primary)', borderRadius: 'var(--radius-md)', cursor: 'pointer', textAlign: 'left' }}
                          >
                            <div style={{ fontSize: '0.75rem', fontWeight: 700, color: 'var(--brand-color)' }}>{subj.code}</div>
                            <strong style={{ fontSize: '0.95rem', display: 'block', marginTop: '4px' }}>{subj.title}</strong>
                          </button>
                        ))}
                      </div>
                      <button onClick={() => setFocusStep('setup')} className="btn-outline">Back</button>
                    </div>
                  )}

                  {/* STEP 4: ACTIVE SESSION */}
                  {focusStep === 'active' && (
                    <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-medium)', borderRadius: 'var(--radius-lg)', padding: '3rem 2rem', textAlign: 'center' }}>
                      <span style={{ background: 'var(--brand-bg)', color: 'var(--brand-color)', border: '1px solid var(--border-medium)', padding: '0.3rem 0.9rem', borderRadius: '20px', fontSize: '0.8rem', fontWeight: 700 }}>
                        {focusSubject ? `Active: ${focusSubject.code}` : 'General Session'} {focusDnd ? '• DND On' : ''}
                      </span>
                      <div style={{ fontSize: '4.5rem', fontWeight: 900, margin: '2rem 0', fontFamily: 'var(--font-mono)', color: 'var(--brand-color)' }}>
                        {fmtTime(focusSecsLeft)}
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'center', gap: '1rem' }}>
                        <button 
                          onClick={() => {
                            if (focusRunning) {
                              clearInterval(focusIntervalRef.current);
                              setFocusRunning(false);
                            } else {
                              startFocusClock(Math.ceil(focusSecsLeft / 60));
                            }
                          }} 
                          className="btn-primary"
                        >
                          {focusRunning ? 'Pause Timer' : 'Resume Timer'}
                        </button>
                        <button onClick={resetFocusSession} className="btn-outline" style={{ borderColor: 'var(--danger-crimson)', color: 'var(--danger-crimson)' }}>
                          Abort Session
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

            </div>
          </div>

          {/* Download App Modal */}
          {showAppModal && (
            <div className="modal-backdrop" onClick={() => setShowAppModal(false)}>
              <div className="login-card" onClick={(e) => e.stopPropagation()} style={{ textAlign: 'center', alignItems: 'center' }}>
                <div className="brand-logo-badge" style={{ width: '56px', height: '56px', fontSize: '1.6rem', margin: '0 auto' }}>📲</div>
                <h2 style={{ fontSize: '1.4rem', fontWeight: 800, marginTop: '10px' }}>CampusOS Mobile App</h2>
                <p style={{ fontSize: '0.9rem', color: 'var(--text-secondary)', marginTop: '6px' }}>The native iOS and Android mobile app is currently in build testing.</p>
                <button className="btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '10px', marginTop: '16px' }} onClick={() => setShowAppModal(false)}>Got it!</button>
              </div>
            </div>
          )}

          {/* Login Simulation Modal */}
          {showLoginModal && (
            <div className="modal-backdrop" onClick={() => setShowLoginModal(false)}>
              <div className="login-card" onClick={e => e.stopPropagation()}>
                <h3 style={{ fontSize: '1.2rem', fontWeight: 800 }}>VTOP SSO Authentication</h3>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', marginTop: '12px' }}>
                  <input className="input-field" defaultValue="22BCE10429" />
                  <input className="input-field" type="password" defaultValue="••••••••••••" />
                </div>
                <div style={{ display: 'flex', gap: '10px', marginTop: '10px' }}>
                  <button className="btn-primary" style={{ flex: 1, justifyContent: 'center' }} onClick={() => { alert("Authenticated!"); setShowLoginModal(false); }}>Sign In</button>
                  <button className="btn-outline" onClick={() => setShowLoginModal(false)}>Cancel</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
