<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Attendance Engine
    function calculateAttendance(attended, total) {
      if (total <= 0) return { attended: 0, total: 0, percentage: 100, safeToMiss: 0, needToAttend: 0, isCritical: false };
      const percentage = Number(((attended / total) * 100).toFixed(1));
      const isCritical = percentage < 75;
      let safeToMiss = 0;
      let needToAttend = 0;
      if (percentage >= 75) {
        safeToMiss = Math.max(0, Math.floor((attended - 0.75 * total) / 0.75));
      } else {
        needToAttend = Math.max(1, Math.ceil((0.75 * total - attended) / 0.25));
      }
      return { attended, total, percentage, safeToMiss, needToAttend, isCritical };
    }

    // Live VTOP Synchronized Datasets
    const initialStudent = {
      name: "Pragyan Jain",

      program: "B.Tech - Computer Science and Engineering",
      semester: 4,
      cgpa: 8.72,
      creditsEarned: 68,
      totalCreditsRequired: 160,
      rank: 14,
    };

    const initialCourses = [

                    </div>
                    <div style={{ textAlign: 'right' }}>
                      <div style={{ fontSize: '1.8rem', fontWeight: 800, color: 'var(--success-emerald)' }}>🔥 42 Days</div>
                      <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>DSA Streak</span>
                    </div>
                  </div>

                  <h3 style={{ fontSize: '1.1rem', fontWeight: 700 }}>DSA Topic Mastery</h3>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: '16px' }}>
                    {initialDsaTopics.map(t => (
                      <div key={t.name} className="course-card" style={{ padding: '18px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                          <h4 style={{ fontSize: '0.92rem', fontWeight: 700 }}>{t.name}</h4>
                          <span style={{ fontSize: '0.8rem', fontWeight: 700, color: 'var(--brand-color)' }}>{t.solved} / {t.total}</span>
                        </div>
                        <div className="progress-track" style={{ margin: '8px 0' }}>
                          <div className="progress-fill emerald" style={{ width: `${(t.solved/t.total)*100}%` }}></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* AI Planner */}
              {view === 'ai' && (
                <div className="page-content">
                  <div style={{ background: 'var(--card-banner-bg)', border: '1px solid var(--border-medium)', borderRadius: 'var(--radius-lg)', padding: '24px' }}>
                    <h2 style={{ fontSize: '1.3rem', fontWeight: 800 }}>🧠 CampusOS AI Priority Engine</h2>
                    <p style={{ fontSize: '0.85rem', color: 'var(--text-secondary)', marginTop: '4px' }}>
                      Automated priority engine calculating critical attendance recovery, upcoming deadlines, and CAT exam schedules.
                    </p>
                  </div>

                  <div className="assignments-container">
                    {initialAITasks.map(task => (
                      <div key={task.id} className="assignment-item-card" style={{ borderColor: task.urgency === 'HIGH' ? 'var(--danger-border)' : 'var(--border-subtle)' }}>
                        <div>
                          <span style={{ fontSize: '0.72rem', fontWeight: 700, padding: '2px 8px', borderRadius: '4px', background: task.urgency === 'HIGH' ? 'var(--danger-bg)' : 'var(--brand-bg)', color: task.urgency === 'HIGH' ? 'var(--danger-crimson)' : 'var(--brand-color)' }}>
                            {task.type}
                          </span>
                          <h3 style={{ fontSize: '1.05rem', fontWeight: 700, marginTop: '4px' }}>{task.headline}</h3>
                          <p style={{ fontSize: '0.85rem', color: 'var(--text-secondary)', marginTop: '4px' }}>{task.reason}</p>
                          <div style={{ marginTop: '8px', fontSize: '0.78rem', color: 'var(--text-muted)' }}>
                            ⏱ Estimated: <b>{task.hours}h</b> • 📍 Suggested Slot: <b>{task.slot}</b>
                          </div>
                        </div>
                        <button className="btn-primary" onClick={() => alert(`Starting session for: ${task.headline}`)}>Start Session ⚡</button>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* Login Simulation Modal */}
          {showLoginModal && (
            <div className="modal-backdrop" onClick={() => setShowLoginModal(false)}>
              <div className="login-card" onClick={e => e.stopPropagation()}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                  <div className="brand-logo-badge">C</div>
                  <div>
                    <h3 style={{ fontSize: '1.2rem', fontWeight: 800 }}>VTOP SSO Authentication</h3>
                    <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Sign in to synchronize your live student data</p>
                  </div>
                </div>

                <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                  <div>
                    <label style={{ fontSize: '0.8rem', color: 'var(--text-secondary)', fontWeight: 600 }}>Registration Number</label>
                    <input className="input-field" defaultValue="22BCE10429" style={{ marginTop: '4px' }} />
                  </div>
                  <div>
                    <label style={{ fontSize: '0.8rem', color: 'var(--text-secondary)', fontWeight: 600 }}>VTOP Password</label>
                    <input className="input-field" type="password" defaultValue="••••••••••••" style={{ marginTop: '4px' }} />
                  </div>
                </div>

                <div style={{ display: 'flex', gap: '10px', marginTop: '10px' }}>
                  <button className="btn-primary" style={{ flex: 1, justifyContent: 'center' }} onClick={() => { alert("Authenticated Pragyan Jain with VTOP SSO!"); setShowLoginModal(false); }}>
                    Sign In & Sync
                  </button>
                  <button className="btn-outline" onClick={() => setShowLoginModal(false)}>
                    Cancel
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
