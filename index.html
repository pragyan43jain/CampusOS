<body>

    const { useState, useEffect } = React;

    // Attendance Engine
    function calculateAttendance(attended, total) {
      if (total <= 0) return { attended: 0, total: 0, percentage: 100, safeToMiss: 0, needToAttend: 0, isCritical: false };
      const percentage = Number(((attended / total) * 100).toFixed(1));
      const isCritical = percentage < 75;
      let safeToMiss = 0;
      let needToAttend = 0;
      if (percentage >= 75) {
        safeToMiss = Math.max(0, Math.floor((attended - 0.75 * total) / 0.75));
      } else {
        needToAttend = Math.max(1, Math.ceil((0.75 * total - attended) / 0.25));
      }
      return { attended, total, percentage, safeToMiss, needToAttend, isCritical };
    }

                      <span style={{ fontSize: '0.75rem', fontWeight: 700, color: 'var(--text-muted)', textTransform: 'uppercase' }}>Total Weightage at Stake</span>
                      <div style={{ fontSize: '1.6rem', fontWeight: 800, color: 'var(--warning-amber)', marginTop: '2px' }}>
                        {assignments.filter(a => a.status === 'Pending').reduce((acc, a) => acc + a.weightage, 0)}% Internal
                      </div>
                      <span style={{ fontSize: '0.78rem', color: 'var(--text-secondary)' }}>Marks towards continuous evaluation</span>
                    </div>
                  </div>

                  {/* Assignments List */}
                  <div className="assignments-container">
                    {displayedAssignments.map((assignment) => {
                      const isPending = assignment.status === 'Pending';
                      const isLms = assignment.source === 'LMS';

                      return (
                        <div
                          key={assignment.id}
                          className="assignment-item-card"
                          style={{
                            borderColor: isPending && assignment.priority === 'Critical' ? 'var(--danger-border)' : 'var(--border-subtle)',
                            background: isPending ? 'var(--bg-surface)' : 'rgba(0, 0, 0, 0.05)',
                            opacity: isPending ? 1 : 0.75,
                            flexDirection: 'column',
                            alignItems: 'stretch',
                            gap: '16px',
                            padding: '22px 24px',
                          }}
                        >
                          {/* Header Row */}
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: '12px' }}>
                            <div style={{ display: 'flex', alignItems: 'flex-start', gap: '14px', flex: 1 }}>
                              <input
                                type="checkbox"
                                checked={assignment.status === 'Submitted'}
                                onChange={() => handleToggleAssignment(assignment.id)}
                                style={{ width: '20px', height: '20px', accentColor: 'var(--brand-color)', marginTop: '4px', cursor: 'pointer' }}
                                title="Mark as Submitted / Pending"
                              />

                              <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap' }}>
                                  {/* Platform Upload Badge */}
                                  <span
                                    style={{
                                      background: isLms ? 'rgba(56, 189, 248, 0.15)' : 'rgba(192, 132, 252, 0.15)',
                                      color: isLms ? 'var(--brand-color)' : '#c084fc',
                                      border: `1px solid ${isLms ? 'rgba(56, 189, 248, 0.3)' : 'rgba(192, 132, 252, 0.3)'}`,
                                      display: 'inline-flex',
                                      alignItems: 'center',
                                      gap: '4px',
                                      padding: '3px 9px',
                                      borderRadius: 'var(--radius-sm)',
                                      fontWeight: 700,
                                      fontSize: '0.74rem',
                                    }}
                                  >
                                    <span>{isLms ? '🌐' : '💜'}</span>
                                    <span>Uploaded on {assignment.platformName}</span>
                                  </span>

                                  {/* Course Code */}
                                  <span style={{ fontSize: '0.78rem', fontFamily: 'var(--font-mono)', fontWeight: 700, color: 'var(--text-muted)' }}>
                                    {assignment.courseCode}
                                  </span>

                                  {/* Priority Tag */}
                                  {isPending && (
                                    <span
                                      style={{
                                        fontSize: '0.7rem',
                                        fontWeight: 800,
                                        padding: '2px 8px',
                                        borderRadius: 'var(--radius-full)',
                                        background: assignment.priority === 'Critical' ? 'var(--danger-bg)' : 'var(--warning-bg)',
                                        color: assignment.priority === 'Critical' ? 'var(--danger-crimson)' : 'var(--warning-amber)',
                                      }}
                                    >
                                      {assignment.priority} Priority
                                    </span>
                                  )}
                                </div>

                                <h3
                                  style={{
                                    fontSize: '1.12rem',
                                    fontWeight: 700,
                                    textDecoration: assignment.status === 'Submitted' ? 'line-through' : 'none',
                                    color: assignment.status === 'Submitted' ? 'var(--text-muted)' : 'var(--text-primary)',
                                  }}
                                >
                                  {assignment.title}
                                </h3>

                                <p style={{ fontSize: '0.84rem', color: 'var(--text-secondary)' }}>
                                  Course: <b>{assignment.courseTitle}</b> • Uploaded by <b>{assignment.faculty}</b>
                                </p>

                                {assignment.instructions && (
                                  <p style={{ fontSize: '0.82rem', color: 'var(--text-muted)', background: 'var(--bg-surface-elevated)', padding: '8px 12px', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-subtle)', marginTop: '4px' }}>
                                    📋 <b>Professor Instructions:</b> {assignment.instructions}
                                  </p>
                                )}
                              </div>
                            </div>

                            {/* Right Meta Column */}
                            <div style={{ textAlign: 'right', display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: '8px' }}>
                              <div style={{ fontSize: '0.92rem', fontWeight: 700, color: isPending ? 'var(--warning-amber)' : 'var(--success-emerald)' }}>
                                {isPending ? `Due: ${assignment.dueDate} at ${assignment.dueTime}` : '✓ Submitted'}
                              </div>
                              <span style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>
                                Weightage: <b style={{ color: 'var(--text-primary)' }}>{assignment.weightage}% of Grade</b>
                              </span>

                              {/* Direct Platform Submission Link Button */}
                              <button
                                className="btn-primary"
                                style={{
                                  fontSize: '0.78rem',
                                  padding: '6px 12px',
                                  marginTop: '4px',
                                  background: isLms ? 'var(--btn-primary-bg)' : '#9333ea',
                                  color: isLms ? 'var(--btn-primary-text)' : '#ffffff',
                                }}
                                onClick={() => {
                                  alert(`Redirecting to submission portal on ${assignment.platformName}:\nURL: ${assignment.platformUrl}`);
                                }}
                              >
                                <span>{isLms ? '🌐 Open on VIT LMS' : '💜 Open on Teams'}</span>
                                <span>↗</span>
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* Fees View */}
              {view === 'fees' && (
                <div className="page-content">
                  <h2 style={{ fontSize: '1.25rem', fontWeight: 700 }}>Fee Management & Receipts</h2>
                  <div className="assignments-container">
                    {fees.map(f => (
                      <div key={f.id} className="assignment-item-card">
                        <div>
                          <span style={{ fontSize: '0.72rem', fontWeight: 700, padding: '2px 8px', borderRadius: '4px', background: 'var(--brand-bg)', color: 'var(--brand-color)' }}>{f.category}</span>
                          <h3 style={{ fontSize: '1.05rem', fontWeight: 700, marginTop: '4px' }}>{f.title}</h3>
                          {f.receipt && <div style={{ fontSize: '0.78rem', fontFamily: 'var(--font-mono)', color: 'var(--text-muted)' }}>Receipt: {f.receipt} • {f.date}</div>}
                        </div>
                        <div style={{ textAlign: 'right' }}>
                          <div style={{ fontSize: '1.2rem', fontWeight: 800 }}>₹{f.amount.toLocaleString('en-IN')}</div>
                          <span className={`attendance-percentage-pill ${f.status === 'Paid' ? 'safe' : 'critical'}`}>{f.status}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Placements & DSA */}
              {view === 'placements' && (
                <div className="page-content">
                  <div style={{ background: 'var(--card-banner-bg)', border: '1px solid var(--border-medium)', borderRadius: 'var(--radius-lg)', padding: '24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <div>
                      <h2 style={{ fontSize: '1.3rem', fontWeight: 800 }}>Placement Eligibility: 100% Eligible (Super Dream)</h2>
                      <p style={{ fontSize: '0.85rem', color: 'var(--text-secondary)', marginTop: '4px' }}>CGPA: 8.72 (Cutoff ≥ 8.0) • Standing Arrears: 0 • Solved DSA: 143 Problems</p>
                    </div>
                    <div style={{ textAlign: 'right' }}>
                      <div style={{ fontSize: '1.8rem', fontWeight: 800, color: 'var(--success-emerald)' }}>🔥 42 Days</div>
                      <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>DSA Streak</span>
                    </div>
                  </div>

                  <h3 style={{ fontSize: '1.1rem', fontWeight: 700 }}>DSA Topic Mastery</h3>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: '16px' }}>
                    {initialDsaTopics.map(t => (
                      <div key={t.name} className="course-card" style={{ padding: '18px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                          <h4 style={{ fontSize: '0.92rem', fontWeight: 700 }}>{t.name}</h4>
                          <span style={{ fontSize: '0.8rem', fontWeight: 700, color: 'var(--brand-color)' }}>{t.solved} / {t.total}</span>
                        </div>
                        <div className="progress-track" style={{ margin: '8px 0' }}>
                          <div className="progress-fill emerald" style={{ width: `${(t.solved/t.total)*100}%` }}></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* AI Study Planner — Low Marks Focus */}
              {view === 'ai' && (
                <div className="page-content">
                  {/* Section Header */}
                  <div style={{ background: 'var(--card-banner-bg)', border: '1px solid var(--border-medium)', borderRadius: 'var(--radius-lg)', padding: '24px' }}>
                    <h2 style={{ fontSize: '1.3rem', fontWeight: 800 }}>📚 Study Planner — Focus Areas</h2>
                    <p style={{ fontSize: '0.85rem', color: 'var(--text-secondary)', marginTop: '4px' }}>
                      Subjects where your internal marks are below 50% — you need to put in extra effort to recover before FAT exams.
                    </p>
                  </div>

                  {/* Low-mark subject cards */}
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                    {lowMarkSubjects.map(sub => {
                      const pct = Math.round((sub.scored / sub.max) * 100);
                      const isCritical = pct < 50;
                      return (
                        <div key={sub.id} style={{
                          background: 'var(--bg-surface)',
                          border: `1.5px solid ${isCritical ? 'var(--danger-border)' : 'var(--warning-border)'}`,
                          borderRadius: 'var(--radius-lg)',
                          padding: '20px 24px',
                          display: 'flex',
                          flexDirection: 'column',
                          gap: '16px'
                        }}>

                          {/* Top row: subject info + score */}
                          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: '12px', flexWrap: 'wrap' }}>
                            <div style={{ flex: 1 }}>
                              <span style={{
                                fontSize: '0.7rem', fontWeight: 800, padding: '3px 9px',
                                borderRadius: '4px', textTransform: 'uppercase', letterSpacing: '0.05em',
                                background: isCritical ? 'var(--danger-bg)' : 'var(--warning-bg)',
                                color: isCritical ? 'var(--danger-crimson)' : 'var(--warning-amber)'
                              }}>
                                {isCritical ? '🚨 Critical — You need to work extra hard' : '⚠️ Warning — Do Better'}
                              </span>
                              <h3 style={{ fontSize: '1.05rem', fontWeight: 800, marginTop: '6px' }}>
                                {sub.code} — {sub.title}
                              </h3>
                              <p style={{
                                fontSize: '0.85rem', marginTop: '4px',
                                color: isCritical ? 'var(--danger-crimson)' : 'var(--warning-amber)',
                                fontWeight: 600
                              }}>
                                {isCritical
                                  ? `Your current score is only ${pct}%. This subject needs your immediate attention — dedicate focused study sessions daily.`
                                  : `Your score is ${pct}%. You need to push harder to cross 75% for a good internal grade.`
                                }
                              </p>
                            </div>
                            {/* Score badge */}
                            <div style={{
                              minWidth: '72px', textAlign: 'center',
                              background: isCritical ? 'var(--danger-bg)' : 'var(--warning-bg)',
                              border: `1px solid ${isCritical ? 'var(--danger-border)' : 'var(--warning-border)'}`,
                              borderRadius: 'var(--radius-md)', padding: '10px 14px'
                            }}>
                              <div style={{ fontSize: '1.5rem', fontWeight: 900, color: isCritical ? 'var(--danger-crimson)' : 'var(--warning-amber)' }}>{pct}%</div>
                              <div style={{ fontSize: '0.7rem', color: 'var(--text-muted)', marginTop: '2px' }}>{sub.scored}/{sub.max}</div>
                            </div>
                          </div>

                          {/* Key topics to revise */}
                          <div>
                            <div style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--text-secondary)', marginBottom: '8px', textTransform: 'uppercase', letterSpacing: '0.05em' }}>📌 Key Topics to Revise</div>
                            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
                              {sub.topics.map((t, i) => (
                                <span key={i} style={{
                                  fontSize: '0.78rem', fontWeight: 600, padding: '4px 10px',
                                  background: 'var(--bg-surface-elevated)',
                                  border: '1px solid var(--border-subtle)',
                                  borderRadius: 'var(--radius-full)'
                                }}>{t}</span>
                              ))}
                            </div>
                          </div>

                          {/* Study material quick-access */}
                          <div style={{ background: 'var(--bg-surface-elevated)', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-md)', padding: '14px 16px' }}>
                            <div style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--text-secondary)', marginBottom: '10px', textTransform: 'uppercase', letterSpacing: '0.05em' }}>🗂 Quick Study Material Access</div>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(160px, 1fr))', gap: '8px' }}>
                              {sub.resources.map((r, i) => (
                                <a
                                  key={i}
                                  href={r.url}
                                  onClick={e => { e.preventDefault(); alert(`Study material will be linked here once the backend is live!\n\nResource: ${r.label}\nSubject: ${sub.title}`); }}
                                  style={{
                                    display: 'flex', alignItems: 'center', gap: '8px',
                                    padding: '8px 12px', borderRadius: 'var(--radius-sm)',
                                    background: 'var(--bg-surface)',
                                    border: '1px solid var(--border-medium)',
                                    fontSize: '0.8rem', fontWeight: 600,
                                    color: 'var(--text-primary)',
                                    textDecoration: 'none', cursor: 'pointer',
                                    transition: 'background 0.15s, border-color 0.15s'
                                  }}
                                  onMouseEnter={e => { e.currentTarget.style.background = 'var(--brand-bg)'; e.currentTarget.style.borderColor = 'var(--brand-color)'; }}
                                  onMouseLeave={e => { e.currentTarget.style.background = 'var(--bg-surface)'; e.currentTarget.style.borderColor = 'var(--border-medium)'; }}
                                >
                                  <span style={{ fontSize: '1rem' }}>{r.icon}</span>
                                  {r.label}
                                </a>
                              ))}
                            </div>
                          </div>

                        </div>
                      );
                    })}
                  </div>

                  {/* Empty state if all subjects are doing well */}
                  {lowMarkSubjects.length === 0 && (
                    <div style={{ textAlign: 'center', padding: '60px 24px', color: 'var(--text-muted)' }}>
                      <div style={{ fontSize: '3rem' }}>🎉</div>
                      <h3 style={{ fontSize: '1.1rem', fontWeight: 700, marginTop: '12px', color: 'var(--success-emerald)' }}>Great work! No subjects need extra attention.</h3>
                      <p style={{ marginTop: '6px', fontSize: '0.85rem' }}>All your subjects are above 50%. Keep it up!</p>
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>

          {/* Download App Modal */}
          {showAppModal && (
            <div className="modal-backdrop" onClick={() => setShowAppModal(false)}>
              <div className="login-card" onClick={(e) => e.stopPropagation()} style={{ textAlign: 'center', alignItems: 'center' }}>
                <div className="brand-logo-badge" style={{ width: '56px', height: '56px', fontSize: '1.6rem', margin: '0 auto' }}>
                  📲
                </div>

                <div>
                  <span style={{ fontSize: '0.75rem', fontWeight: 800, padding: '4px 10px', background: 'var(--brand-bg)', color: 'var(--brand-color)', borderRadius: 'var(--radius-full)', textTransform: 'uppercase' }}>
                    Under Development
                  </span>
                  <h2 style={{ fontSize: '1.4rem', fontWeight: 800, marginTop: '10px' }}>CampusOS Mobile App</h2>
                  <p style={{ fontSize: '0.9rem', color: 'var(--text-secondary)', marginTop: '6px' }}>
                    The native iOS and Android mobile app is currently in build testing.
                  </p>
                </div>

                <div style={{ background: 'var(--bg-surface-elevated)', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-md)', padding: '16px 20px', width: '100%', display: 'flex', flexDirection: 'column', gap: '10px' }}>
                  <div style={{ fontSize: '1.1rem', fontWeight: 800, color: 'var(--brand-color)' }}>
                    🚀 Coming Soon
                  </div>
                  <p style={{ fontSize: '0.82rem', color: 'var(--text-muted)' }}>
                    Featuring offline timetable widgets, real-time attendance notification alerts, and automated LMS assignment sync.
                  </p>

                  <div style={{ display: 'flex', gap: '8px', justifyContent: 'center', marginTop: '6px' }}>
                    <div style={{ padding: '6px 12px', background: 'var(--bg-surface)', border: '1px solid var(--border-medium)', borderRadius: 'var(--radius-sm)', fontSize: '0.8rem', fontWeight: 700 }}>
                      🍏 iOS App Store
                    </div>
                    <div style={{ padding: '6px 12px', background: 'var(--bg-surface)', border: '1px solid var(--border-medium)', borderRadius: 'var(--radius-sm)', fontSize: '0.8rem', fontWeight: 700 }}>
                      🤖 Google Play
                    </div>
                  </div>
                </div>

                <button
                  className="btn-primary"
                  style={{ width: '100%', justifyContent: 'center', padding: '10px' }}
                  onClick={() => setShowAppModal(false)}
                >
                  Got it!
                </button>
              </div>
            </div>
          )}

          {/* Login Simulation Modal */}
          {showLoginModal && (
            <div className="modal-backdrop" onClick={() => setShowLoginModal(false)}>
              <div className="login-card" onClick={e => e.stopPropagation()}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                  <div className="brand-logo-badge">C</div>
                  <div>
                    <h3 style={{ fontSize: '1.2rem', fontWeight: 800 }}>VTOP SSO Authentication</h3>
                    <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Sign in to synchronize your live student data</p>
                  </div>
                </div>

                <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                  <div>
                    <label style={{ fontSize: '0.8rem', color: 'var(--text-secondary)', fontWeight: 600 }}>Registration Number</label>
                    <input className="input-field" defaultValue="22BCE10429" style={{ marginTop: '4px' }} />
                  </div>
                  <div>
                    <label style={{ fontSize: '0.8rem', color: 'var(--text-secondary)', fontWeight: 600 }}>VTOP Password</label>
                    <input className="input-field" type="password" defaultValue="••••••••••••" style={{ marginTop: '4px' }} />
                  </div>
                </div>

                <div style={{ display: 'flex', gap: '10px', marginTop: '10px' }}>
                  <button className="btn-primary" style={{ flex: 1, justifyContent: 'center' }} onClick={() => { alert("Authenticated Pragyan Jain with VTOP SSO!"); setShowLoginModal(false); }}>
                    Sign In & Sync
                  </button>
                  <button className="btn-outline" onClick={() => setShowLoginModal(false)}>
                    Cancel
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
